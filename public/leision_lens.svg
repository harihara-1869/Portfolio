<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Stylized retinal scan with highlighted lesions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="55%" stop-color="#120e1d"/>
      <stop offset="100%" stop-color="#1b1128"/>
    </linearGradient>
    <radialGradient id="retina" cx="40%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f7c6a0"/>
      <stop offset="28%" stop-color="#e091a4"/>
      <stop offset="58%" stop-color="#a75478"/>
      <stop offset="82%" stop-color="#5e2a48"/>
      <stop offset="100%" stop-color="#2a1224"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2c4"/>
      <stop offset="60%" stop-color="#f2cf7a"/>
      <stop offset="100%" stop-color="#c99a3c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c770f0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c770f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lesion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b8a"/>
      <stop offset="100%" stop-color="#ff6b8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c770f0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c770f0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c770f0" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="fundus">
      <circle cx="310" cy="200" r="150"/>
    </clipPath>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="310" cy="200" r="250" fill="url(#glow)"/>

  <g clip-path="url(#fundus)">
    <circle cx="310" cy="200" r="150" fill="url(#retina)"/>
    <circle cx="365" cy="160" r="26" fill="url(#disc)"/>
    <circle cx="365" cy="160" r="26" fill="#fff" opacity="0.12"/>

    <g fill="none" stroke="#ffd9e6" stroke-linecap="round" opacity="0.55">
      <path d="M365 160 C 340 150, 320 128, 296 112" stroke-width="3.5"/>
      <path d="M365 160 C 335 170, 305 176, 278 170" stroke-width="3"/>
      <path d="M365 160 C 345 185, 330 210, 322 240" stroke-width="3"/>
      <path d="M365 160 C 385 145, 405 140, 430 138" stroke-width="2.5"/>
      <path d="M322 240 C 300 252, 282 260, 262 262" stroke-width="2"/>
      <path d="M296 112 C 282 100, 270 92, 252 88" stroke-width="2"/>
      <path d="M330 210 C 312 220, 300 232, 292 248" stroke-width="1.8"/>
    </g>

    <g fill="url(#lesion)">
      <circle cx="235" cy="170" r="20"/>
      <circle cx="255" cy="238" r="16"/>
      <circle cx="392" cy="235" r="18"/>
      <circle cx="330" cy="285" r="14"/>
      <circle cx="285" cy="150" r="12"/>
      <circle cx="415" cy="195" r="11"/>
    </g>
    <g fill="#ff6b8a">
      <circle cx="235" cy="170" r="4.5"/>
      <circle cx="255" cy="238" r="3.5"/>
      <circle cx="392" cy="235" r="4"/>
      <circle cx="330" cy="285" r="3"/>
      <circle cx="285" cy="150" r="2.8"/>
      <circle cx="415" cy="195" r="2.6"/>
    </g>

    <g stroke="#c770f0" stroke-width="1" opacity="0.12">
      <line x1="160" y1="200" x2="460" y2="200"/>
      <line x1="310" y1="50" x2="310" y2="350"/>
    </g>
    <rect x="160" y="200" width="300" height="2" fill="url(#scan)" opacity="0.7"/>
  </g>

  <circle cx="310" cy="200" r="150" fill="none" stroke="#c770f0" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="310" cy="200" r="162" fill="none" stroke="#c770f0" stroke-opacity="0.12" stroke-width="1"/>

  <g opacity="0.5" stroke="#c770f0" stroke-width="2" fill="none">
    <path d="M585 120 h-35 M585 120 v35"/>
    <path d="M705 120 h-35 M705 120 v35"/>
    <path d="M585 280 h-35 M585 280 v-35"/>
    <path d="M705 280 h-35 M705 280 v-35"/>
  </g>
  <g fill="#c770f0" opacity="0.75">
    <circle cx="585" cy="120" r="3"/>
    <circle cx="705" cy="120" r="3"/>
    <circle cx="585" cy="280" r="3"/>
    <circle cx="705" cy="280" r="3"/>
  </g>

  <g fill="none" stroke="#c770f0" stroke-opacity="0.5" stroke-width="1.5">
    <path d="M560 200 h20 l8 -12 l10 24 l10 -18 l8 6 h30"/>
  </g>
</svg>
